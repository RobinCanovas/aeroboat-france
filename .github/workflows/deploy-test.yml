name: Déploiement test

# Déploie dist/ vers /www/test/ (jamais la racine /www/ de la production).
# Secrets du dépôt requis : FTP_SERVER, FTP_USERNAME, FTP_PASSWORD.
on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-test
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_sqlite, mbstring, gd, fileinfo
          coverage: none

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build de la release (dist/)
        run: npm run release

      - name: Envoi FTPS vers /www/test/
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          security: strict
          local-dir: dist/
          server-dir: /www/test/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            storage/**
            public/uploads/**
            .env
